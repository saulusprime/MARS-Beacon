name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: flake8 + pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: flake8 mars_audit.py marsbeacon/ mars_gui.py mars_citations.py tests/
      - name: Test
        run: pytest -q

  lighthouse:
    name: Integrazione Lighthouse (Node + Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Fork Lighthouse (tag dal PIN, build inclusa)
        run: tools/update-lighthouse.sh
      - name: Test Lighthouse (unit + integrazione reale)
        # Chrome e' preinstallato sui runner ubuntu-latest: il test
        # d'integrazione non viene saltato e usa il fork appena
        # installato contro il sito fixture locale.
        run: pytest -q tests/test_lighthouse.py

  a11y:
    name: Accessibilita (Pa11y, WCAG 2 AA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Avvio della GUI in background
        run: |
          python mars_gui.py --no-browser --port 8765 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/api/env > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/api/env > /dev/null
      - name: Pa11y (pagine pubbliche e vista autenticata)
        env:
          PA11Y_CHROME: /usr/bin/google-chrome
        run: npx --yes pa11y-ci@3 --config .pa11yci.js

  api:
    name: Contratto API (contract test + e2e a origini separate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Contract test, bundle separato ed e2e a due origini
        # Il contratto OpenAPI e' verificato contro il registro
        # (golden docs/openapi.json), le risposte reali contro gli
        # schemi; l'e2e replica l'assetto separato: statici su
        # un'origine, API sull'altra con CORS, ciclo completo
        # audit -> referti via token Bearer. node --check sul
        # bundle (Node preinstallato sui runner ubuntu).
        run: >
          pytest -q tests/test_api_contract.py
          tests/test_frontend_separato.py
          tests/test_e2e_separato.py
