# Brand Lympha Technologies per il bundle statico gui/.
# Si applica con: python tools/brandizza.py branding/lympha-technologies.toml
# E' il brand del repository: applicarlo su un albero pulito non
# deve produrre alcuna differenza (verificato dalla suite).
#
# I token CSS di questo file erano gui/brand/lympha-brand.css: da
# qui il tool genera gui/brand/brand.css (stessa separazione del
# de-theming: la STRUTTURA vive in theme.css e consuma i token via
# var(--lt-*); il DELTA di brand sta tutto in questo file).

[brand]
nome = "Lympha"                # prima riga del marchio in testata
sottonome = "technologies"     # seconda riga (lt-tag)
ragione_sociale = "Lympha Technologies S.r.l."
titolo_index = "MARS Beacon — Lympha Technologies"
anno = 2026            # anno statico mostrato senza JavaScript
copyright_dal = 2011   # usato solo dal footer minimo generato

[asset]
# Nomi senza directory = file gia' presenti in gui/brand/;
# un percorso con directory (relativo a questo file) viene
# copiato dal tool dentro gui/brand/.
logo = "lympha-mark.svg"
favicon = "favicon.png"

[palette]
# Palette del logo. Il tool verifica i contrasti WCAG AA delle
# coppie realmente usate da theme.css e rifiuta il brand se una
# scende sotto 4.5:1 (il referto e la GUI non devono mai mentire
# sull'accessibilita' dichiarata).
teal = "#186078"       # primario (dal logo)
teal_700 = "#0f4a5b"   # hover/active e testo link su chiaro
teal_900 = "#0c3540"   # superfici scure (footer)
navy = "#17324d"       # navy di brand (sezioni profonde)
navy_700 = "#0f2236"   # navy piu' scuro per barre/bordi
gray_grave = "#373737" # grigio del footer
aqua = "#5bb6bf"       # decorativo (mai per testo su bianco)
aqua_soft = "#b7e0e3"  # decorativo / testo su fondo scuro
mist = "#eef6f7"       # sfondi chiari
orange = "#d86010"     # accento brand (dal logo, decorativo)
orange_700 = "#a8480f" # accento come testo su chiaro
ink = "#14272b"        # testo principale su chiaro
ink_soft = "#3c5054"   # testo secondario su chiaro
border = "rgba(8,49,58,.12)"  # bordi tenui (non verificato: alpha)

